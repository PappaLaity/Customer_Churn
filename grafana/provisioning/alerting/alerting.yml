# Grafana Alerting Configuration
# Reference: https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/

apiVersion: 1

contactPoints:
  - orgId: 1
    name: "churn-alerts"
    receivers:
      - uid: "email-alerts"
        type: email
        settings:
          addresses: "amahamat@aimsammi.org"
          singleEmail: true
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: "churn-alerts"
    group_by: ['alertname', 'severity']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
