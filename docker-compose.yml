services:
  db:
    image: postgres:15
    container_name: churn_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: churn_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - churn_network
  mlflow_db:
    image: postgres:15
    container_name: mlflow_db
    environment:
      POSTGRES_USER: ${MLFLOW_DB_USER}
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD}
      POSTGRES_DB: mlflow_db
    volumes:
      - mlflow_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - churn_network
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: churn_api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_REGISTRY_NAME: CustomerChurnModel
      MODEL_STAGE: Production
      ENV: Production
      MLFLOW_URI: http://mlflow:5000
      API_KEY_SECRET: ${API_KEY_SECRET:-changeme-in-production}
    depends_on:
      - db
    volumes:
      - ./data:/app/data
      - ./.git:/app/.git
      - ./.dvc:/app/.dvc
      - ./.gitignore:/app/.gitignore
      - ./remote:/app/remote
      - ./mlflow_artifacts:/mlflow/artifacts
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
           python src/api/core/seed.py &&
           uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --workers 4"
    restart: unless-stopped
    networks:
      - churn_network

  # Airflow init container - runs database migrations and user creation
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-init
    entrypoint: >
      bash -c "
        set -e
        airflow db migrate &&
        airflow users create -u admin -p admin -f telco -l company -r Admin -e admin@telco.com || true
      "
    environment:
      - AIRFLOW_HOME=/opt/airflow
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_URI=http://mlflow:5000
      - PYTHONPATH=/opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./models:/opt/airflow/models
      - ./data:/opt/airflow/data
      - ./drifts:/opt/airflow/drifts
      - ./src:/opt/airflow/src
      - ./.git:/opt/airflow/.git
      - ./.dvc:/opt/airflow/.dvc
      - ./.gitignore:/opt/airflow/.gitignore
      - ./remote:/opt/airflow/remote
      - ./mlflow_artifacts:/mlflow/artifacts
      - airflow_data:/opt/airflow # Shared Airflow data including DB
    depends_on:
      - mlflow
    networks:
      - churn_network
    restart: "no" # Only runs once

  # Airflow Webserver - provides the UI
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-webserver
    entrypoint: >
      bash -c "
        set -e
        rm -f /opt/airflow/airflow-webserver.pid
        airflow webserver
      "
    environment:
      - AIRFLOW_HOME=/opt/airflow
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_URI=http://mlflow:5000
      - PYTHONPATH=/opt/airflow
      - PRODUCTION_DATA_PATH=/opt/airflow/data/production/production.csv
      - FEATURES_PATH=/opt/airflow/data/features/features.csv
      - PSI_THRESHOLD=0.2
      - AIRFLOW__LOGGING__LOG_SERVER_HOST=localhost
      - AIRFLOW__LOGGING__LOG_SERVER_PORT=8793
      - AIRFLOW__LOGGING__WORKER_LOG_SERVER_PORT=8793
    volumes:
      - ./dags:/opt/airflow/dags
      - ./models:/opt/airflow/models
      - ./data:/opt/airflow/data
      - ./drifts:/opt/airflow/drifts
      - ./src:/opt/airflow/src
      - ./.git:/opt/airflow/.git
      - ./.dvc:/opt/airflow/.dvc
      - ./.gitignore:/opt/airflow/.gitignore
      - ./remote:/opt/airflow/remote
      - ./mlflow_artifacts:/mlflow/artifacts
      - airflow_data:/opt/airflow # Shared Airflow data including DB
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_started
    ports:
      - "8080:8080"
    restart: always # Always restart on failure
    networks:
      - churn_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Airflow Scheduler - schedules and triggers DAG runs
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-scheduler
    entrypoint: >
      bash -c "
        set -e
        airflow scheduler
      "
    environment:
      - AIRFLOW_HOME=/opt/airflow
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_URI=http://mlflow:5000
      - PYTHONPATH=/opt/airflow
      - PRODUCTION_DATA_PATH=/opt/airflow/data/production/production.csv
      - FEATURES_PATH=/opt/airflow/data/features/features.csv
      - PSI_THRESHOLD=0.2
      - AIRFLOW__LOGGING__LOG_SERVER_HOST=localhost
      - AIRFLOW__LOGGING__LOG_SERVER_PORT=8793
      - AIRFLOW__LOGGING__WORKER_LOG_SERVER_PORT=8793
    volumes:
      - ./dags:/opt/airflow/dags
      - ./models:/opt/airflow/models
      - ./data:/opt/airflow/data
      - ./drifts:/opt/airflow/drifts
      - ./src:/opt/airflow/src
      - ./.git:/opt/airflow/.git
      - ./.dvc:/opt/airflow/.dvc
      - ./.gitignore:/opt/airflow/.gitignore
      - ./remote:/opt/airflow/remote
      - ./mlflow_artifacts:/mlflow/artifacts
      - airflow_data:/opt/airflow # Shared Airflow data including DB
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_started
    restart: always # Always restart on failure
    networks:
      - churn_network
    healthcheck:
      test: [ "CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\"" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: mlflow
    depends_on:
      - mlflow_db
    volumes:
      - ./mlflow_artifacts:/mlflow/artifacts
    ports:
      - "5001:5000"
    restart: unless-stopped
    networks:
      - churn_network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - churn_network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=${SMTP_USER:-}
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - GF_SMTP_FROM_ADDRESS=noreply@churn-monitoring.local
      - GF_SMTP_FROM_NAME=Churn Monitoring
    depends_on:
      - prometheus
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    restart: unless-stopped
    networks:
      - churn_network

  nginx-reports:
    image: nginx:alpine
    container_name: nginx-reports
    volumes:
      - ./data/monitoring/reports:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8888:80"
    restart: unless-stopped
    networks:
      - churn_network
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db_data:
  grafana-storage:
  prometheus-data:
  mlflow_db_data:
  mlflow_artifacts:
  airflow_data:
    # Persistent Airflow database and logs


networks:
  churn_network:
    driver: bridge
