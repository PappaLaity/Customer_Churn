  integration-test-full:
    name: Integration Tests (full)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/refactor/mlops-improvements')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space (très important avec TensorFlow)
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/share/swift"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Create temporary .env for CI
        run: |
          cat <<EOF > .env.ci
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DATABASE_URL=postgresql+psycopg2://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@db:5432/churn_db
          MLFLOW_DB_USER=${{ secrets.MLFLOW_DB_USER }}
          MLFLOW_DB_PASSWORD=${{ secrets.MLFLOW_DB_PASSWORD }}
          API_KEY_SECRET=${{ secrets.API_KEY_SECRET }}
          GF_SECURITY_ADMIN_USER=${{ secrets.GF_SECURITY_ADMIN_USER }}
          GF_SECURITY_ADMIN_PASSWORD=${{ secrets.GF_SECURITY_ADMIN_PASSWORD }}
          ENV=test
          EOF

      # LA LIGNE MAGIQUE QUI RÉSOUT TOUT (plus de no space + build ultra rapide)
      - name: Build Docker image (cached + tensorflow-cpu léger)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          load: true                                      # rend l’image disponible à docker compose
          tags: customer-churn-fastapi:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

      # Plus besoin de cette étape, l’image est déjà construite ci-dessus
      # - name: Build only fastapi service (faster)
      #   run: ...

      - name: Start services with docker-compose
        run: |
          docker compose --env-file .env.ci -f docker-compose.yml up -d
          sleep 60

      - name: Check services health
        run: |
          docker compose --env-file .env.ci -f docker-compose.yml ps
          docker compose --env-file .env.ci -f docker-compose.yml logs fastapi --tail 200

      - name: Run integration tests
        run: |
          docker compose --env-file .env.ci -f docker-compose.yml exec -T fastapi \
            pytest tests/ -v -m "integration" --maxfail=5

      - name: Cleanup
        if: always()
        run: |
          docker compose --env-file .env.ci -f docker-compose.yml down -v || true