name: CI/CD TEST Pipeline
run-name: CI/CD Pipeline - by  @${{ github.actor }}
on:
  push:
    branches: ["refactor/mlops-improvements"]
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    branches: ["develop"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (unit only)
        run: |
          ENV=test MLFLOW_TRACKING_URI=file:///tmp/mlruns pytest -m "not integration"

  # ═════════════════════════════════════════════════════════════
  # JOB 1: Linting (Qualité du code)
  # ═════════════════════════════════════════════════════════════
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort
      
      - name: Run flake8
        run: |
          # Stop si erreurs critiques
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning pour le reste (ne fait pas échouer le build)
          flake8 src/ --count --max-line-length=100 --statistics || true
      
      - name: Check code formatting with black
        run: |
          black --check src/ tests/ || echo "⚠️ Code needs formatting"
      
      - name: Check import order with isort
        run: |
          isort --check-only src/ tests/ || echo "⚠️ Imports need sorting"

  # ═════════════════════════════════════════════════════════════
  # JOB 2: Tests unitaires
  # ═════════════════════════════════════════════════════════════
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint  # Attend que le linting passe
    
    # Variables d'environnement pour les tests
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/churn_test
      ENV: test
    
    # Services PostgreSQL pour les tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: churn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock
      
      - name: Run tests with coverage (exclude integration)
        run: |
          pytest tests/ -v -m "not integration" \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=30 \
            --maxfail=3
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: always()
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # ═════════════════════════════════════════════════════════════
  # JOB 3: Tests d'intégration
  # ═════════════════════════════════════════════════════════════
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker images (local compose)
        run: |
          docker compose -f docker-compose.local.yml build
      
      - name: Start services (local compose)
        run: |
          docker compose -f docker-compose.local.yml up -d
          sleep 30
      
      - name: Check services health
        run: |
          docker compose -f docker-compose.local.yml ps
          docker compose -f docker-compose.local.yml logs churn_api
      
      - name: Run integration tests
        run: |
          docker compose -f docker-compose.local.yml exec -T churn_api pytest tests/ -v -m "integration"
      
      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.local.yml down -v